<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Auth{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'accounts/styles.css' %}" rel="stylesheet">
  </head>
  <body>
    <header class="p-3 text-center bg-white shadow-sm">
      <a href="/" class="fw-bold text-dark text-decoration-none">MySite</a>
      <nav class="mt-2">
        <ul class="nav justify-content-center">
          {% if user.is_authenticated %}
            <li class="nav-item"><a class="nav-link text-dark" href="{% url 'accounts:authorized' %}">Authorized</a></li>
            <li class="nav-item"><a class="nav-link text-dark" href="{% url 'accounts:logout' %}">Log out</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link text-dark" href="{% url 'accounts:login' %}">Log in</a></li>
            <li class="nav-item"><a class="nav-link text-dark" href="{% url 'accounts:register' %}">Create an account</a></li>
          {% endif %}
        </ul>
      </nav>
    </header>

```
<div class="container mt-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} mt-3">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
