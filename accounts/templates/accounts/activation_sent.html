{% extends 'accounts/base.html' %}
{% block title %}Activation sent{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Activation email sent</h3>
    <p>We sent an activation link to <strong>{{ email }}</strong>. Please check your inbox.</p>
    <p>If you didn't receive it, <a href="{% url 'accounts:resend_activation' %}" onclick="event.preventDefault(); document.getElementById('resend-form').submit();">Resend activation</a>.</p>
    <form id="resend-form" method="post" action="{% url 'accounts:resend_activation' %}">{% csrf_token %}<input type="hidden" name="email" value="{{ email }}"></form>
  </div>
</div>
{% endblock %}
