{% extends 'accounts/base.html' %}
{% block title %}Authorized page{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-8">
    <h3>Authorized page</h3>
    <nav class="nav">
      <a class="nav-link" href="{% url 'accounts:password_change' %}">Change password</a>

</div>
{% endblock %}
